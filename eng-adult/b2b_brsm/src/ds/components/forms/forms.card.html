<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-core);background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch}=window.JustSchoolDesignSystem_7c4918;
function Demo(){
  const [v,setV]=React.useState('');const [lvl,setLvl]=React.useState('B1');
  const [c,setC]=React.useState(true);const [r,setR]=React.useState(50);const [s,setS]=React.useState(true);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px 24px'}}>
    <Input label="Ваше ім'я" placeholder="Олена" value={v} onChange={e=>setV(e.target.value)} hint="Як до вас звертатися"/>
    <Select label="Рівень" options={['A1','A2','B1','B2','C1']} value={lvl} onChange={setLvl}/>
    <Input label="Email" type="email" value="olena@" error="Перевірте адресу"/>
    <Input label="Промокод" placeholder="JUSTSCHOOL" disabled/>
    <div className="col">
      <Checkbox checked={c} onChange={setC} label="Погоджуюсь з умовами" description="Договір-оферта · Конфіденційність"/>
      <Checkbox checked={false} onChange={()=>{}} label="Отримувати новини"/>
    </div>
    <div className="col">
      <Radio checked={r===50} onChange={()=>setR(50)} label="50 хвилин" description="студент + викладач · онлайн"/>
      <Radio checked={r===60} onChange={()=>setR(60)} label="60 хвилин"/>
      <Switch checked={s} onChange={setS} label="Нагадування про урок"/>
    </div>
  </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
